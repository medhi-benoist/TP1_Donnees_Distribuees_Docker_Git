services:
  leader-node:
    build: ./app
    container_name: node-leader
    environment:
      NODE_NAME: leader
      ROLE: leader
      PORT: 8080
      FOLLOWERS: http://node-follower-1:8080,http://node-follower-2:8080
    networks:
      - distributed-net
    ports:
      - "8080:8080"

  follower-node-1:
    build: ./app
    container_name: node-follower-1
    environment:
      NODE_NAME: follower-1
      ROLE: follower
      PORT: 8080
      LEADER_URL: http://node-leader:8080
    networks:
      - distributed-net
    ports:
      - "8081:8080"

  follower-node-2:
    build: ./app
    container_name: node-follower-2
    environment:
      NODE_NAME: follower-2
      ROLE: follower
      PORT: 8080
      LEADER_URL: http://node-leader:8080
    networks:
      - distributed-net
    ports:
      - "8082:8080"

networks:
  distributed-net:
    name: distributed-net
    external: true
